# @package model
# FOMO60K (pkoutsouvelis) MONAI SwinViT-V2 backbone for asparagus finetune/eval.
# Pretrained MAE encoder; fresh linear head attached per downstream task.

dimensions: 3D
deep_supervision: False

cls_net: smri_fomo60k
reg_net: smri_fomo60k
seg_net: smri_fomo60k

_seg_net:
  _target_: asparagus_bridge.models_smri_fomo60k.SmriFomo60kUniformSegBackbone
  dimensions: ${model.dimensions}
  deep_supervision: ${model.deep_supervision}

_cls_net:
  _target_: asparagus_bridge.models_smri_fomo60k.SmriFomo60kClsRegBackbone
  dimensions: ${model.dimensions}

_reg_net:
  _target_: asparagus_bridge.models_smri_fomo60k.SmriFomo60kClsRegBackbone
  dimensions: ${model.dimensions}

finetune_optim: AdamW
finetune_lr: 1e-4
weight_decay: 3e-5
