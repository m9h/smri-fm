# @package model
# FOMO25-winning Multi-Modal U-Net VAE (Banuelos/Gordaliza et al.) for asparagus
# finetune/eval. Self-supervised (masked reconstruction) on FOMO60K raw MRI;
# run in "regression" mode with a fresh ClsRegHead per downstream task. Most
# task-aligned arm (same FOMO domain + SSL3D lineage). See models_smri_mmunetvae.

dimensions: 3D
deep_supervision: False

cls_net: smri_mmunetvae
reg_net: smri_mmunetvae
seg_net: smri_mmunetvae

_cls_net:
  _target_: asparagus_bridge.models_smri_mmunetvae.SmriMmunetvaeClsRegBackbone
  dimensions: ${model.dimensions}

_reg_net:
  _target_: asparagus_bridge.models_smri_mmunetvae.SmriMmunetvaeClsRegBackbone
  dimensions: ${model.dimensions}

_seg_net:
  _target_: asparagus_bridge.models_smri_mmunetvae.SmriMmunetvaeSegBackbone
  dimensions: ${model.dimensions}
  deep_supervision: ${model.deep_supervision}

finetune_optim: AdamW
finetune_lr: 1e-4
weight_decay: 3e-5
