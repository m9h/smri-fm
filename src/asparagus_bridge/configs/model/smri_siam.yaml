# @package model
# SIAM (romainVala) nnU-Net backbone for asparagus finetune/eval.
# Requires SIAM_MODEL_DIR pointing at the SIAM result folder
# (containing plans.json, dataset.json, fold_0/checkpoint_final.pth).

dimensions: 3D
deep_supervision: False

seg_net: smri_siam
cls_net: smri_siam
reg_net: smri_siam

_seg_net:
  _target_: asparagus_bridge.models_smri_siam.SmriSiamSegBackbone
  dimensions: ${model.dimensions}
  deep_supervision: ${model.deep_supervision}

_cls_net:
  _target_: asparagus_bridge.models_smri_siam.SmriSiamClsRegBackbone
  dimensions: ${model.dimensions}

_reg_net:
  _target_: asparagus_bridge.models_smri_siam.SmriSiamClsRegBackbone
  dimensions: ${model.dimensions}

finetune_optim: AdamW
finetune_lr: 1e-4
weight_decay: 3e-5
