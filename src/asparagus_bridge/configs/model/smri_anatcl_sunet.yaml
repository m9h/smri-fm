# @package model
# AnatCL (EIDOSLAB) 3D-ResNet-18 backbone for asparagus finetune/eval.
# Pretrained with anatomical weakly-contrastive (y-aware) objective on OpenBHB
# (cat12 VBM GM maps); fresh linear head per downstream task. Domain caveat:
# pretrained on VBM, finetuned here on raw-T1 FOMO26 (see models_smri_anatcl).

dimensions: 3D

cls_net: smri_anatcl
reg_net: smri_anatcl
seg_net: smri_anatcl

deep_supervision: False

_seg_net:
  _target_: asparagus_bridge.models_smri_anatcl.SmriAnatclUniformSegBackbone
  dimensions: ${model.dimensions}
  deep_supervision: ${model.deep_supervision}
  decoder_kind: swinunetr

_cls_net:
  _target_: asparagus_bridge.models_smri_anatcl.SmriAnatclClsRegBackbone
  dimensions: ${model.dimensions}

_reg_net:
  _target_: asparagus_bridge.models_smri_anatcl.SmriAnatclClsRegBackbone
  dimensions: ${model.dimensions}

finetune_optim: AdamW
finetune_lr: 1e-4
weight_decay: 3e-5
