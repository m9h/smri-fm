# @package model
# BrainIAC (AIM-KannLab) MONAI ViT-B backbone for asparagus finetune/eval.
# Pretrained SimCLR encoder; fresh linear head attached per downstream task.

dimensions: 3D

cls_net: smri_brainiac
reg_net: smri_brainiac
seg_net: smri_brainiac

_cls_net:
  _target_: asparagus_bridge.models_smri_brainiac.SmriBrainiacClsRegBackbone
  dimensions: ${model.dimensions}

_reg_net:
  _target_: asparagus_bridge.models_smri_brainiac.SmriBrainiacClsRegBackbone
  dimensions: ${model.dimensions}

finetune_optim: AdamW
finetune_lr: 1e-4
weight_decay: 3e-5
