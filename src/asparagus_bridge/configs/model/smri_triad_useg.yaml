# @package model
# Triad (wangshansong1) MONAI SwinViT-V2 backbone for asparagus finetune/eval.
# Pretrained MAE encoder (~131k vols); fresh linear head per downstream task.
# Same Swin family as smri_fomo60k, depths (2,2,2,2) vs (2,2,6,2).

dimensions: 3D

cls_net: smri_triad
reg_net: smri_triad
seg_net: smri_triad

deep_supervision: False

_seg_net:
  _target_: asparagus_bridge.models_smri_triad.SmriTriadUniformSegBackbone
  dimensions: ${model.dimensions}
  deep_supervision: ${model.deep_supervision}

_cls_net:
  _target_: asparagus_bridge.models_smri_triad.SmriTriadClsRegBackbone
  dimensions: ${model.dimensions}

_reg_net:
  _target_: asparagus_bridge.models_smri_triad.SmriTriadClsRegBackbone
  dimensions: ${model.dimensions}

finetune_optim: AdamW
finetune_lr: 1e-4
weight_decay: 3e-5
