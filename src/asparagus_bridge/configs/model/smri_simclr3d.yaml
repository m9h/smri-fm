# @package model
# 3D-Neuro-SimCLR (Kaczmarek et al.) MONAI 3D-ResNet-18 backbone for asparagus
# finetune/eval. Pretrained with SimCLR NT-Xent contrastive on RAW T1w brain MRI
# (turboprep/MNI152); fresh linear head per downstream task. Closer-domain
# transfer arm than AnatCL (raw T1, not VBM). See models_smri_simclr3d.

dimensions: 3D

cls_net: smri_simclr3d
reg_net: smri_simclr3d
seg_net: smri_simclr3d

_cls_net:
  _target_: asparagus_bridge.models_smri_simclr3d.SmriSimclr3dClsRegBackbone
  dimensions: ${model.dimensions}

_reg_net:
  _target_: asparagus_bridge.models_smri_simclr3d.SmriSimclr3dClsRegBackbone
  dimensions: ${model.dimensions}

finetune_optim: AdamW
finetune_lr: 1e-4
weight_decay: 3e-5
